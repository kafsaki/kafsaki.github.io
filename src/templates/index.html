<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="site.css"><script defer src="background.js"></script></head><body><div id="bg-stage" aria-hidden="true"><canvas id="bg-pixels"></canvas></div><header class="site-header"><nav><a class="brand" href="index.html">{{ title }}</a><div class="nav-links"><a href="archives.html">归档</a><a href="tags.html">标签</a><a href="about.html">关于</a></div></nav><div class="hero"><p class="eyebrow">个人技术日志 · {{ count }} 篇文章</p><h1>把复杂问题写清楚。</h1><p>记录系统编程、AI Agent 与持续构建中的真实经验。</p></div></header><main><div class="toolbar"><label for="search">搜索文章</label><input id="search" type="search" placeholder="输入标题或关键词" autocomplete="off"></div><section class="post-grid" id="posts">{{ content }}</section></main><footer>© 2026 kafsaki</footer><script>const input=document.querySelector('#search');input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();document.querySelectorAll('.post-card').forEach(card=>card.hidden=q&&!card.textContent.toLowerCase().includes(q));});</script></body></html>
